name: Deploy BI Wikolabs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          missing=""
          [ -z "${{ secrets.WIKOLABS_VM_HOST }}"       ] && missing="$missing WIKOLABS_VM_HOST"
          [ -z "${{ secrets.WIKOLABS_VM_SSH_KEY }}"    ] && missing="$missing WIKOLABS_VM_SSH_KEY"
          [ -z "${{ secrets.WIKOLABS_VM_USER }}"       ] && missing="$missing WIKOLABS_VM_USER"
          [ -z "${{ secrets.GROQ_API_KEY }}"           ] && missing="$missing GROQ_API_KEY"
          [ -z "${{ secrets.POSTGRES_PASSWORD }}"      ] && missing="$missing POSTGRES_PASSWORD"
          [ -z "${{ secrets.MONGODB_URI }}"            ] && missing="$missing MONGODB_URI"
          [ -z "${{ secrets.CHAINLIT_AUTH_SECRET }}"   ] && missing="$missing CHAINLIT_AUTH_SECRET"
          if [ -n "$missing" ]; then
            echo "Missing required GitHub secrets:$missing"
            exit 1
          fi
          echo "All required secrets present."

      - name: Deploy to VM via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WIKOLABS_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.WIKOLABS_VM_HOST }}
          VM_USER: ${{ secrets.WIKOLABS_VM_USER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CHAINLIT_AUTH_SECRET: ${{ secrets.CHAINLIT_AUTH_SECRET }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ENV_B64=$(printf 'MONGODB_URI=%s\nGROQ_API_KEY=%s\nPOSTGRES_PASSWORD=%s\nPOSTGRES_URI=postgresql://bi:%s@postgres:5432/bi_wikolabs\nCHAINLIT_AUTH_SECRET=%s\n' \
            "$MONGODB_URI" "$GROQ_API_KEY" "$POSTGRES_PASSWORD" "$POSTGRES_PASSWORD" "$CHAINLIT_AUTH_SECRET" | base64 -w 0)

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VM_USER@$VM_HOST" "
            set -e
            APP_DIR=/opt/bi-wikolabs
            if [ ! -d \"\$APP_DIR/.git\" ]; then
              git clone https://github.com/Wikolabs/bi-wikolabs.git \$APP_DIR
            fi
            cd \$APP_DIR
            git pull origin main
            printf '%s' \"$ENV_B64\" | base64 -d > .env
            docker compose up -d --build --remove-orphans
            echo 'Waiting for app...'
            for i in \$(seq 1 12); do
              if docker compose exec -T app python -c 'import sys; sys.exit(0)' 2>/dev/null; then
                echo 'App is up.'
                break
              fi
              sleep 5
            done
            docker compose exec -T app python seed.py || true
            echo 'Deployed bi-wikolabs on port 8000'
          "
