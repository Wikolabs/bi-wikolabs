name: Diagnostics
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Get logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/bi-wikolabs
            sleep 20
            echo "=== APP LOGS ==="
            docker compose logs --tail=300 app 2>&1
            echo "=== CADDY LOGS ==="
            docker compose logs --tail=30 caddy 2>&1
            echo "=== CONTAINER STATUS ==="
            docker compose ps 2>&1
