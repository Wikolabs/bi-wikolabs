services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - bi_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bi_wikolabs
      POSTGRES_USER: bi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - bi_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi -d bi_wikolabs"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - MONGODB_URI
      - POSTGRES_URI=postgresql://bi:${POSTGRES_PASSWORD}@postgres:5432/bi_wikolabs
      - CHAINLIT_AUTH_SECRET
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data
      - model_cache:/root/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - bi_net

networks:
  bi_net:

volumes:
  pg_data:
  mongo_data:
  app_data:
  model_cache:
